[package]
name = "cotest"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
# C.8 — opt-in testcontainers-backed Postgres bring-up for Linux CI.
# `coauth_bootstrap` historically shelled out to the docker CLI because
# named-pipe docker-engine integration is fragile on Windows; with this
# feature on, Linux jobs get a managed `testcontainers` lifecycle that
# survives panics without depending on `docker rm -fv`.
test-with-containers = ["dep:testcontainers"]

[dependencies]
# CT-19 — `arbitrary` powers the wire-envelope fuzz harness in
# `cotest/src/fuzz/`. Lives in `[dependencies]` rather than
# `[dev-dependencies]` so the harness types (FuzzEventInput / FuzzMoveInput /
# ...) and the `fuzz_*` entry points can live in `src/` and be invoked from
# integration tests under `tests/`.
# Real Ed25519 detached-JWS verification in the security-negative conformance
# suite (`conformance/security_negative.rs`) so a forged event with a correct
# digest but invalid signature is actually rejected, not just digest-compared.
# R3.2 (cokret-spec @ b56cab1) — the §3.2.1 primary-handle-selection,
# `claim_digest`, and §3.8.2 mention-render helpers live in the high-level
# `cokret` facade (`cokret::identity::*`). cotest's primary-handle /
# mention vectors drive these directly so every implementation agrees on
# the deterministic selection + canonical claim digest.
# T5.3 (Round 22) — canonical hash convergence vectors in
# `tests/canonical_hash_convergence.rs` exercise the high-level
# `EventProofBuilder` facade alongside the low-level canonical helpers
# to pin that every Cokret service hashes payloads identically.
# lattice round-trip vectors: cotest exercises the SDK's
# `cokret_core::lattice` module directly to confirm CasRegister / OrSet /
# Counter / Fsm / MvRegister / OrderedLog implementations match the spec's
# normative join semantics.
# coauth_bootstrap / floria_bootstrap render generated YAML to disk
# and need a Drop-managed temp file. Pinned to the version already in the
# lockfile so `cargo test --locked` doesn't try to mutate Cargo.lock.
# C.8 — Linux-only testcontainers integration (see `test-with-containers`
# feature). Pinned conservatively; the cotest harness only uses the
# stable `Container` / `RunnableImage` surface so a minor bump in
# testcontainers itself shouldn't affect us.
anyhow = {workspace = true}
argon2 = {workspace = true,default-features = false,features = ["alloc", "password-hash"]}
arbitrary = {workspace = true,features = ["derive"]}
base64 = {workspace = true}
chacha20poly1305 = {workspace = true,default-features = false,features = ["alloc"]}
chrono = {workspace = true}
cokret = {workspace = true}
cokret-client = {workspace = true}
cokret-core = {workspace = true,features = ["client"]}
cokret-http-client = {workspace = true}
cokret-signatures = {workspace = true}
ed25519-dalek = {workspace = true,default-features = false,features = ["std"]}
hkdf = {workspace = true}
hpke-rs = {workspace = true}
hpke-rs-crypto = {workspace = true}
hpke-rs-rust-crypto = {workspace = true}
jsonschema = {workspace = true,default-features = false,features = ["resolve-file"]}
reqwest = {workspace = true,features = ["json", "multipart"]}
salvo = {workspace = true}
serde = {workspace = true,features = ["derive"]}
serde_json = {workspace = true}
serde_yaml_ng = {workspace = true}
sha2 = {workspace = true}
tempfile = {workspace = true}
testcontainers = {workspace = true,optional = true}
tokio = {workspace = true,features = ["macros", "process", "rt-multi-thread", "time"]}
tracing = {workspace = true}
tracing-subscriber = {workspace = true,features = ["env-filter", "json"]}
url = {workspace = true}

[dev-dependencies]
# T8.2 — property tests for canonical-JSON / proof vectors and handle
# claim validators across the SDK contract surface.
proptest = {workspace = true,default-features = false,features = ["std"]}
serial_test = {workspace = true}

[workspace]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.102"
argon2 = {version = "0.5.3",default-features = false,features = ["alloc", "password-hash"]}
arbitrary = "1.4"
base64 = "0.22.1"
blake3 = {version = "1.5.5",default-features = false}
chacha20poly1305 = {version = "0.10.1",default-features = false}
chrono = "0.4.45"
chrono-tz = {version = "0.10.4",default-features = false}
cokret = {path = "../cokret-rust-sdk/crates/sdk"}
cokret-client = {path = "../cokret-rust-sdk/crates/client"}
cokret-core = {path = "../cokret-rust-sdk/crates/core"}
cokret-http-client = {path = "../cokret-rust-sdk/crates/http-client"}
cokret-signatures = {path = "../cokret-rust-sdk/crates/signatures"}
ed25519-dalek = {version = "2.2.0",default-features = false}
hkdf = "0.13.0"
hpke-rs = "0.6"
hpke-rs-crypto = "0.6"
hpke-rs-rust-crypto = "0.6"
jsonschema = {version = "0.46.5",default-features = false}
proptest = {version = "1",default-features = false}
reqwest = "0.13.4"
salvo = {git = "https://github.com/salvo-rs/salvo.git",branch = "main",features = ["affix-state"]}
serde = "1.0.228"
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
serial_test = "3.5.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
testcontainers = "0.27"
tokio = "1.52.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
