[package]
name = "cotest"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = "0.4.42"
contrix-sdk = { path = "../contrix-rust-sdk/crates/contrix-sdk", default-features = false, features = ["client"] }
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "time"] }
url = "2.5.7"

[dev-dependencies]
serial_test = "3.2.0"
