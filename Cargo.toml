[package]name = "cotest"version = "0.1.0"edition = "2024"rust-version = "1.92"[dependencies]anyhow = "1.0.100"base64 = "0.22.1"chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }chrono = "0.4.42"contrix-http-client = { path = "../contrix-rust-sdk/crates/http-client" }contrix-core = { path = "../contrix-rust-sdk/crates/core", features = ["client"] }# lattice round-trip vectors: cotest exercises the SDK's# `contrix_core::lattice` module directly to confirm CasRegister / OrSet /# Counter / Fsm / MvRegister / OrderedLog implementations match the spec's# normative join semantics.hkdf = "0.12.4"jsonschema = { version = "0.46.4", default-features = false, features = ["resolve-file"] }pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }reqwest = { version = "0.12.24", features = ["json"] }serde = { version = "1.0.228", features = ["derive"] }serde_json = "1.0.145"serde_yaml = "0.9.34"sha2 = "0.10.9"# coauth_bootstrap / floria_bootstrap render generated YAML to disk# and need a Drop-managed temp file. Pinned to the version already in the# lockfile so `cargo test --locked` doesn't try to mutate Cargo.lock.tempfile = "3.27.0"tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "time"] }tracing = "0.1.44"tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }url = "2.5.7"[dev-dependencies]serial_test = "3.2.0"