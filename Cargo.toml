[package]
name = "cotest"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = "0.4.42"
contrix-client = { path = "../contrix-rust-sdk/crates/client" }
contrix-core = { path = "../contrix-rust-sdk/crates/core", features = ["client"] }
# C10.C lattice round-trip vectors: cotest exercises the SDK's contrix-lattice
# crate directly to confirm CasRegister / OrSet / Counter / Fsm / MvRegister /
# OrderedLog implementations match the spec's normative join semantics.
contrix-lattice = { path = "../contrix-rust-sdk/crates/lattice" }
jsonschema = { version = "0.46.4", default-features = false, features = ["resolve-file"] }
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "time"] }
url = "2.5.7"

[dev-dependencies]
serial_test = "3.2.0"
