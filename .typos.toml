[default]
extend-ignore-re = [
    # DID key multibase strings are opaque test vectors, not prose.
    "z6Mk[0-9A-Za-z]+",
]
extend-ignore-identifiers-re = [
    # *sigh* this just isn't worth the cost of fixing
    "AttributeID.*Supress.*",
]

[default.extend-identifiers]
# *sigh* this just isn't worth the cost of fixing
AttributeIDSupressMenu = "AttributeIDSupressMenu"

[default.extend-words]
# Don't correct the surname "Teh"
teh = "teh"
Hashi = "Hashi"
consts = "consts"
PN = "PN"
pn = "pn"
ba = "ba"
mis = "mis"
MENT = "MENT"
OT = "OT"
unparseable = "unparseable"

[files]
extend-exclude = [
    "**/*.js",
    "**/*.css",
    "**/*.html",
    "examples/*/static/**/*.*",
    "tests/fixtures/**/*.json",
]
