[default]
extend-ignore-re = [
    # DID key multibase strings are opaque test vectors, not prose.
    "z6Mk[0-9A-Za-z]+",
]
[default.extend-words]
# Don't correct the surname "Teh"
teh = "teh"
consts = "consts"
PN = "PN"
pn = "pn"
ba = "ba"
mis = "mis"
MENT = "MENT"
OT = "OT"
unparseable = "unparseable"
driveable = "driveable"

[files]
extend-exclude = [
    "**/*.js",
    "**/*.css",
    "**/*.html",
    "examples/*/static/**/*.*",
    "tests/fixtures/**/*.json",
]
