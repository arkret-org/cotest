[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # Tracked release exception inherited through hpke-rs-libcrux.
    "RUSTSEC-2026-0124",
    # OpenMLS -> hpke-rs -> libcrux -> hax: maintenance notice only.
    # Remove once the upstream graph replaces proc-macro-error2.
    "RUSTSEC-2026-0173",
    # Same inherited maintenance notices as Inkson, with no compatible
    # replacements in the pinned Dioxus GTK3 backend and image dependencies.
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0436",
    # Inherited Coauth signing-only RSA exception. PKCS#1 v1.5 decryption is
    # not used; re-evaluate immediately if introduced or a patched release lands.
    # Coauth security review deadline remains 2026-10-14.
    "RUSTSEC-2023-0071",
]

[licenses]
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "PostgreSQL",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
