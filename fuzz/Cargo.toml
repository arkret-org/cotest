[package]
name = "cotest-fuzz"
version = "0.3.0"
publish = false
edition = "2024"
rust-version.workspace = true

# P5.1 — cargo-fuzz crate that hosts the two CI fuzz targets
# (envelope_fuzz / realm_state_snapshot_fuzz). Each target wraps the
# matching entry point in `cotest::fuzz::*` so the host crate keeps the
# arbitrary-derived input types and validator wiring.
#
# This sub-crate is intentionally NOT part of the cotest workspace
# (`cargo check --workspace` skips it) — cargo-fuzz manages its own
# nightly + libFuzzer toolchain and bringing it under -workspace would
# force every CI job to install nightly. The crate is exercised only by
# the dedicated `fuzz` CI job and by manual `cargo fuzz run` invocations.

[package.metadata]
cargo-fuzz = true

[workspace]

[workspace.package]
rust-version = "1.98"

[[bin]]
name = "envelope_fuzz"
path = "fuzz_targets/envelope_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "realm_state_snapshot_fuzz"
path = "fuzz_targets/realm_state_snapshot_fuzz.rs"
test = false
doc = false
bench = false

[dependencies]
cotest = { path = ".." }
libfuzzer-sys = "0.4"
# Standalone crate; cargo-fuzz convention.
