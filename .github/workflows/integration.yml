name: integration

# CT-003 live lane. MLS data-plane and provider live tests are deliberately
# isolated in controlled.yml behind a protected GitHub environment.

# Cross-project bring-up (P2F.5.2). Builds the upstream services
# (soland / coauth / floria) from sibling checkouts and runs the cotest
# harness against them.
#
# IMPORTANT (per `_todos_all.md` §0):
#   * does NOT publish any release artefact, push tags, or bump versions.
#   * artefacts uploaded here are CI evidence only.

on:
  workflow_dispatch:
  schedule:
    # Nightly bring-up keeps cross-repo live-stack regressions visible even
    # when no PR has churned cotest.
    - cron: "0 4 * * *"

env:
  CARGO_TERM_COLOR: always
  SIBLING_REF: circle-rollout

jobs:
  joint-bringup:
    name: bringup soland + coauth + floria + cotest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOLAND_BIN: ${{ github.workspace }}/soland/target/release/soland
      COAUTH_BIN: ${{ github.workspace }}/coauth/target/release/coauth
      FLORIA_BIN: ${{ github.workspace }}/floria/target/release/floria
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: ${{ env.SIBLING_REF }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/yoface
          path: yoface
          ref: ${{ env.SIBLING_REF }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: inkson
          ref: ${{ env.SIBLING_REF }}
      # P5.1 — upstream checkout failures MUST hard-fail the job. The previous
      # `continue-on-error: true` markers were a circle-rollout bootstrap
      # tolerance; once the sibling repos are on the `circle-rollout` ref the
      # job has no business green-lighting a partial bringup.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/soland
          path: soland
          ref: ${{ env.SIBLING_REF }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: ${{ env.SIBLING_REF }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          ref: ${{ env.SIBLING_REF }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cotest
            soland
            coauth
            floria
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Runs before the ~40 minutes of builds and live tests below: a retired
      # protocol literal is a fixture bug the compiler cannot see, and finding
      # it after the bringup wastes the whole job. The scanner proves itself
      # against planted vectors first, so a scanner that silently stopped
      # matching cannot report "clean".
      - name: stale protocol literal scan
        working-directory: cotest
        run: |
          set -euo pipefail
          sh scripts/tests/stale-literal-scan.tests.sh
          sh scripts/stale-literal-scan.sh
      - name: build upstream services
        # P5.1 — upstream checkouts now hard-fail (see above) so the missing-svc
        # warning branch is removed; the build step also no longer swallows
        # individual `cargo build` failures.
        run: |
          set -euo pipefail
          for svc in soland coauth floria; do
            echo "::group::cargo build $svc"
            # coauth: password-bootstrap compiles in the password-login
            # session-grant path (runtime stays triple-gated by config flag +
            # COAUTH_ALLOW_INSECURE_PASSWORD_BOOTSTRAP); without it the
            # handler is #[cfg]-ed out and always answers
            # password_login_session_grants_disabled.
            features=""
            if [ "$svc" = "coauth" ]; then
              features="--features cedar,password-bootstrap"
            fi
            (cd "$svc" && cargo build --release --locked $features)
            echo "::endgroup::"
          done
      - name: install playwright
        working-directory: cotest/e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: install dioxus cli
        run: cargo install dioxus-cli --version 0.7.9 --locked
      - name: terminal-auth UI logout live lane
        working-directory: cotest
        shell: pwsh
        run: >
          ./scripts/run-joint-e2e.ps1
          -StartCoauth
          -RunProfile joint-smoke
          -PlaywrightProject chromium
          -Grep 'terminal auth loss|transient self-path failure'
          -SkipNpmInstall
          -SkipBrowserInstall
          -StartupTimeoutSeconds 900
      - name: run cotest harness
        working-directory: cotest
        # Default tests must pass before any live opt-in gates run.
        run: cargo test --workspace --locked
      - name: production placeholder-proof rejection sentinel
        working-directory: cotest
        # This is the only reverse guard for "production soland rejects the
        # inkson dev-proof placeholder", so CI wires SOLAND_BIN explicitly and
        # treats missing binary / test failure as red.
        run: cargo test --locked --features test-with-containers --test production_rejects_placeholder_proof_e2e -- --ignored production_rejects_placeholder_proof_e2e
      - name: run live Playwright smoke
        working-directory: cotest/e2e
        env:
          COTEST_SOLAND_BASE_URL: http://127.0.0.1:8008
          COTEST_EMBEDDED_WEBVH_REGISTRATION_BEARER: cotest-webvh-registration
          COTEST_WIRE_BIN: ${{ github.workspace }}/cotest/target/debug/cotest-wire
          COTEST_JOINT_RUN_DIR: ${{ github.workspace }}/cotest/artifacts/runs/integration-playwright/joint-e2e
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/soland-objects"
          SOLAND_DEVELOPMENT_MODE=1 \
          SOLAND_CANDIDATE_JOIN_POLICY=1 \
          SOLAND_PUBLIC_BASE_URL="$COTEST_SOLAND_BASE_URL" \
          SOLAND_EMBEDDED_WEBVH_REGISTRATION_BEARER="$COTEST_EMBEDDED_WEBVH_REGISTRATION_BEARER" \
          SOLAND_METRICS_BIND="127.0.0.1:9008" \
          SOLAND_OBJECT_STORAGE_BACKEND="filesystem" \
          SOLAND_OBJECT_STORAGE_LOCAL_ROOT="$RUNNER_TEMP/soland-objects" \
          "$SOLAND_BIN" --bind 127.0.0.1:8008 > "$RUNNER_TEMP/soland-playwright.log" 2>&1 &
          soland_pid=$!
          cleanup() {
            set +e
            kill "$soland_pid" 2>/dev/null
            wait "$soland_pid" 2>/dev/null
          }
          trap cleanup EXIT
          for _ in {1..40}; do
            if curl -fsS "$COTEST_SOLAND_BASE_URL/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "$COTEST_SOLAND_BASE_URL/health" >/dev/null
          export COTEST_SOLAND_SERVICE_ID
          COTEST_SOLAND_SERVICE_ID="$(curl -fsS "$COTEST_SOLAND_BASE_URL/health" | jq -er '.checks.service_identity.service_id')"
          npx playwright test --config playwright.config.ts --project=chromium tests/sync/service-surface-contract.spec.ts --grep "soland /_arkret/describe"
          npx playwright test --config playwright.config.ts --project=chromium tests/spaces/knock-application.spec.ts
      - name: run federation security hardening Playwright
        working-directory: cotest/e2e
        # Each node gets its own hostname (mapped to loopback below) instead of
        # a bare `127.0.0.1:<port>`. The denylist matcher compares *hosts*, not
        # host:port, so two nodes sharing `127.0.0.1` can only be deny-listed
        # together — the assertions would then hold for any implementation.
        # Distinct hostnames also give distinct service DIDs and trust domains,
        # because soland derives both from `SOLAND_PUBLIC_BASE_URL`, so no
        # identity has to be injected into boot config (decisions/0012).
        #
        # Private-network egress stays *allowed* here on purpose. With it off,
        # neither node can reach the other at all, both assertions pass without
        # the denylist ever running, and the job reports a false green. The
        # egress guard itself is covered by soland's own unit tests.
        env:
          COTEST_SOLAND_BASE_URL: http://soland-alpha.security-ci.local:8011
          COTEST_SOLAND_ALPHA_BASE_URL: http://soland-alpha.security-ci.local:8011
          COTEST_SOLAND_BETA_BASE_URL: http://soland-beta.security-ci.local:8012
          # FIXTURE ONLY, same seeds the joint-e2e runner uses: handed to soland
          # as `SOLAND_NOTARY_SIGNING_KEY` and to the spec as the peer signing
          # key, so the inbound push carries a cryptographically *valid*
          # signature. Without them the push dies at signature verification and
          # never reaches the denylist branch.
          COTEST_SOLAND_SERVICE_SIGNING_KEY: OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk=
          COTEST_SOLAND_BETA_SERVICE_SIGNING_KEY: ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg=
          # Outbound-fanout coverage registers a real user on alpha, and the
          # embedded did:webvh registration endpoint answers 503 until this is
          # configured on both sides.
          COTEST_EMBEDDED_WEBVH_REGISTRATION_BEARER: cotest-webvh-registration
          COTEST_EXPECT_FEDERATION_DENYLIST: "1"
          COTEST_REQUIRE_DUAL_SOLAND: "1"
          COTEST_JOINT_RUN_DIR: ${{ github.workspace }}/cotest/artifacts/runs/federation-security-hardening/joint-e2e
          RUST_LOG: info
        run: |
          set -euo pipefail

          echo "127.0.0.1 soland-alpha.security-ci.local soland-beta.security-ci.local" \
            | sudo tee -a /etc/hosts > /dev/null

          # Only the deny-listing side of each pair is set, so both env names
          # carry real coverage: beta rejects alpha inbound, alpha drops beta
          # from outbound fanout.
          start_soland() {
            local name="$1"
            local bind="$2"
            local metrics_bind="$3"
            local base_url="$4"
            local trust_domain="$5"
            local notary_seed="$6"
            local peer_url="$7"
            local denylist_name="$8"
            local denylist_host="$9"
            local objects_root="$RUNNER_TEMP/${name}-objects"
            mkdir -p "$objects_root"
            env \
              SOLAND_DEVELOPMENT_MODE=1 \
              SOLAND_PUBLIC_BASE_URL="$base_url" \
              SOLAND_TRUST_DOMAIN="$trust_domain" \
              SOLAND_NOTARY_SIGNING_KEY="$notary_seed" \
              SOLAND_EMBEDDED_WEBVH_REGISTRATION_BEARER="$COTEST_EMBEDDED_WEBVH_REGISTRATION_BEARER" \
              SOLAND_METRICS_BIND="$metrics_bind" \
              SOLAND_OBJECT_STORAGE_BACKEND="filesystem" \
              SOLAND_OBJECT_STORAGE_LOCAL_ROOT="$objects_root" \
              SOLAND_FEDERATION_PEERS="$peer_url" \
              SOLAND_EGRESS_ALLOW_PRIVATE_NETWORKS=1 \
              "${denylist_name}=${denylist_host}" \
              "$SOLAND_BIN" --bind "$bind" > "$RUNNER_TEMP/${name}.log" 2>&1 &
            echo "$!"
          }

          alpha_pid=$(start_soland \
            "soland-alpha-security" \
            "127.0.0.1:8011" \
            "127.0.0.1:9011" \
            "$COTEST_SOLAND_ALPHA_BASE_URL" \
            "ak:trust_domain:soland-alpha.security-ci.local" \
            "$COTEST_SOLAND_SERVICE_SIGNING_KEY" \
            "$COTEST_SOLAND_BETA_BASE_URL" \
            "SOLAND_FEDERATION_PEER_DENYLIST" \
            "soland-beta.security-ci.local")
          beta_pid=$(start_soland \
            "soland-beta-security" \
            "127.0.0.1:8012" \
            "127.0.0.1:9012" \
            "$COTEST_SOLAND_BETA_BASE_URL" \
            "ak:trust_domain:soland-beta.security-ci.local" \
            "$COTEST_SOLAND_BETA_SERVICE_SIGNING_KEY" \
            "$COTEST_SOLAND_ALPHA_BASE_URL" \
            "SOLAND_FEDERATION_DENYLIST" \
            "soland-alpha.security-ci.local")
          cleanup() {
            set +e
            kill "$alpha_pid" "$beta_pid" 2>/dev/null
            wait "$alpha_pid" "$beta_pid" 2>/dev/null
          }
          trap cleanup EXIT

          for url in "$COTEST_SOLAND_ALPHA_BASE_URL/health" "$COTEST_SOLAND_BETA_BASE_URL/health"; do
            for _ in {1..40}; do
              if curl -fsS "$url" >/dev/null; then
                break
              fi
              sleep 1
            done
            curl -fsS "$url" >/dev/null
          done

          # Both processes must still be alive: a node that died after answering
          # /health once would leave the topology half-built.
          kill -0 "$alpha_pid"
          kill -0 "$beta_pid"

          # Service identity comes from the running process, never from config.
          export COTEST_SOLAND_ALPHA_SERVICE_ID
          export COTEST_SOLAND_BETA_SERVICE_ID
          export COTEST_SOLAND_SERVICE_ID
          COTEST_SOLAND_ALPHA_SERVICE_ID="$(curl -fsS "$COTEST_SOLAND_ALPHA_BASE_URL/health" | jq -er '.checks.service_identity.service_id')"
          COTEST_SOLAND_BETA_SERVICE_ID="$(curl -fsS "$COTEST_SOLAND_BETA_BASE_URL/health" | jq -er '.checks.service_identity.service_id')"
          COTEST_SOLAND_SERVICE_ID="$COTEST_SOLAND_ALPHA_SERVICE_ID"
          if [ "$COTEST_SOLAND_ALPHA_SERVICE_ID" = "$COTEST_SOLAND_BETA_SERVICE_ID" ]; then
            echo "::error::alpha and beta minted the same service DID; the denylist cannot distinguish them" >&2
            exit 1
          fi

          # Peer discovery installs the other node's assertion key. Until it has
          # run, an inbound push is rejected for an unresolvable key rather than
          # by the denylist, which is exactly the vacuous pass this job exists
          # to prevent.
          for log in "$RUNNER_TEMP/soland-alpha-security.log" "$RUNNER_TEMP/soland-beta-security.log"; do
            for _ in {1..60}; do
              if grep -q "resolved federation peer service identity and assertion key" "$log"; then
                break
              fi
              sleep 1
            done
            if ! grep -q "resolved federation peer service identity and assertion key" "$log"; then
              echo "::error::$log never resolved its federation peer" >&2
              exit 1
            fi
          done

          npx playwright test --config playwright.config.ts --project=chromium tests/federation/security-hardening.spec.ts
      - name: run selected ignored live harness probes
        working-directory: cotest
        # Keep this list explicit. A workspace-wide `cargo test -- --ignored`
        # also runs tracked scaffold/manual debt. Nightly should fail on
        # selected live probe failures, not on known deferred work.
        #
        # The `test-with-containers` feature is Linux-only (see
        # `src/scenarios/_helpers/coauth_bootstrap.rs`). We enable it
        # here so the Ubuntu job exercises the testcontainers bring-up
        # alongside the docker-CLI path.
        run: |
          set -euo pipefail
          cargo test --locked --features test-with-containers --test _bootstrap_smoke ephemeral_postgres_starts_and_stops -- --ignored
          cargo test --locked --features test-with-containers --test _bootstrap_smoke coauth_can_be_spawned_with_ephemeral_postgres -- --ignored
          cargo test --locked --features test-with-containers --test _bootstrap_smoke floria_can_be_spawned_with_rendered_config -- --ignored
          cargo test --locked --features test-with-containers --test chaos_inject_smoke testcontainers_postgres_bringup_smoke -- --ignored
      - name: upload live harness artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-harness-artifacts
          path: |
            cotest/artifacts/runs/integration-playwright
            cotest/artifacts/runs/federation-security-hardening
