name: integration

# Cross-project bring-up (P2F.5.2). Builds the upstream services
# (soland / coauth / floria) from sibling checkouts and runs the cotest
# harness against them. Publishes journey-coverage.json as an artifact.
#
# IMPORTANT (per `_todos_all.md` §0):
#   * does NOT publish any release artefact, push tags, or bump versions.
#   * artefacts uploaded here are CI evidence only.

on:
  workflow_dispatch:
  schedule:
    # Nightly bring-up so journey-coverage / fixme-debt deltas are visible
    # even when no PR has churned cotest.
    - cron: "0 4 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  joint-bringup:
    name: bringup soland + coauth + floria + cotest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        with:
          repository: contrix-dev/contrix-rust-sdk
          path: contrix-rust-sdk
          ref: circle-rollout
      - uses: actions/checkout@v4
        with:
          repository: contrix-dev/soland
          path: soland
          ref: circle-rollout
        continue-on-error: true
      - uses: actions/checkout@v4
        with:
          repository: contrix-dev/coauth
          path: coauth
          ref: circle-rollout
        continue-on-error: true
      - uses: actions/checkout@v4
        with:
          repository: contrix-dev/floria
          path: floria
          ref: circle-rollout
        continue-on-error: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cotest
            soland
            coauth
            floria
      - name: build upstream services
        run: |
          set -euo pipefail
          for svc in soland coauth floria; do
            if [ -d "$svc" ]; then
              echo "::group::cargo build $svc"
              (cd "$svc" && cargo build --release --locked || true)
              echo "::endgroup::"
            else
              echo "::warning::$svc checkout missing; skipping"
            fi
          done
      - name: run cotest harness
        working-directory: cotest
        # `--ignored` flips on the bringup-dependent scenarios under
        # tests/_bootstrap_smoke.rs / tests/full_stack_e2e.rs. The
        # circle / directory scenarios already run in ci.yml; this job
        # adds the live cross-service exercises.
        #
        # The `test-with-containers` feature is Linux-only (see
        # `src/scenarios/_helpers/coauth_bootstrap.rs`). We enable it
        # here so the Ubuntu job exercises the testcontainers bring-up
        # alongside the docker-CLI path.
        run: |
          cargo test --workspace --locked
          cargo test --workspace --locked --features test-with-containers -- --ignored || true
      - name: upload journey-coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-coverage
          path: |
            cotest/journey-coverage.json
            cotest/journey-coverage.md
