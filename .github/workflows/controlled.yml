name: controlled

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Controlled test tier
        required: true
        type: choice
        options:
          - mls-data-plane
          - platform-live
      environment:
        description: Protected GitHub environment containing endpoints and credentials
        required: true
        default: controlled-e2e
        type: string
      service_versions:
        description: Comma-separated component@version/ref declarations
        required: true
        type: string
      sibling_ref:
        description: Cross-repository ref used for the controlled build
        required: true
        default: main
        type: string
      mls_harness_version:
        description: MLS browser/wasm harness version or commit
        required: false
        type: string
      platform_provider:
        description: Provider name for platform-live
        required: false
        type: string
      platform_adapter_version:
        description: Provider adapter version or commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  controlled:
    name: ${{ inputs.lane }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 120
    env:
      COTEST_SERVICE_VERSIONS: ${{ inputs.service_versions }}
      COTEST_MLS_HARNESS_VERSION: ${{ inputs.mls_harness_version }}
      COTEST_PLATFORM_PROVIDER: ${{ inputs.platform_provider }}
      COTEST_PLATFORM_ADAPTER_VERSION: ${{ inputs.platform_adapter_version }}
      COTEST_SOLAND_BASE_URL: ${{ secrets.COTEST_SOLAND_BASE_URL }}
      COTEST_INKSON_BASE_URL: ${{ secrets.COTEST_INKSON_BASE_URL }}
      COTEST_COAUTH_BASE_URL: ${{ secrets.COTEST_COAUTH_BASE_URL }}
      COTEST_REQUIRE_JOINT_STACK: "1"
      COTEST_PLATFORM_LIVE_TOKEN: ${{ secrets.COTEST_PLATFORM_LIVE_TOKEN }}
      COTEST_PLATFORM_LIVE_BASE_URL: ${{ secrets.COTEST_PLATFORM_LIVE_BASE_URL }}
      COTEST_PLATFORM_WEBHOOK_PATH: ${{ secrets.COTEST_PLATFORM_WEBHOOK_PATH }}
      COTEST_PLATFORM_WEBHOOK_BODY_BASE64: ${{ secrets.COTEST_PLATFORM_WEBHOOK_BODY_BASE64 }}
      COTEST_PLATFORM_WEBHOOK_HEADERS_JSON: ${{ secrets.COTEST_PLATFORM_WEBHOOK_HEADERS_JSON }}
      COTEST_JOINT_RUN_DIR: ${{ github.workspace }}/cotest/artifacts/runs/controlled/${{ inputs.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        if: inputs.lane == 'mls-data-plane'
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ inputs.sibling_ref }}
      - uses: actions/checkout@v4
        if: inputs.lane == 'mls-data-plane'
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ inputs.sibling_ref }}
      - uses: actions/checkout@v4
        if: inputs.lane == 'mls-data-plane'
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: ${{ inputs.sibling_ref }}
      - uses: actions/checkout@v4
        if: inputs.lane == 'mls-data-plane'
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: inkson
          ref: ${{ inputs.sibling_ref }}
      - uses: actions/checkout@v4
        if: inputs.lane == 'mls-data-plane'
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: ${{ inputs.sibling_ref }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        if: inputs.lane == 'mls-data-plane'
        with:
          repository: ${{ github.repository_owner }}/soland
          path: soland
          ref: ${{ inputs.sibling_ref }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        if: inputs.lane == 'mls-data-plane'
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: ${{ inputs.sibling_ref }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        if: inputs.lane == 'mls-data-plane'
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          ref: ${{ inputs.sibling_ref }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@master
        if: inputs.lane == 'mls-data-plane'
        with:
          toolchain: "1.98"
          targets: wasm32-unknown-unknown
      - name: Validate controlled-lane preconditions
        working-directory: cotest
        run: bash scripts/check_tier_preconditions.sh "${{ inputs.lane }}"
      - name: Install Playwright
        working-directory: cotest/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install wasm-bindgen test runner
        if: inputs.lane == 'mls-data-plane'
        working-directory: inkson
        shell: bash
        run: |
          version=$(awk '/name = "wasm-bindgen"/{found=1; next} found && /version = /{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.lock)
          test -n "$version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Run real MLS wasm crypto vector in headless Chrome
        if: inputs.lane == 'mls-data-plane'
        working-directory: inkson
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked --target wasm32-unknown-unknown --test mls_data_plane_wasm -- --nocapture
      - name: Run accepted-device pairing and recovery generation invalidation
        if: inputs.lane == 'mls-data-plane'
        working-directory: cotest/e2e
        shell: bash
        run: |
          npx playwright test --config playwright.config.ts --project=chromium tests/identity/multi-device.spec.ts
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(Path(os.environ['COTEST_JOINT_RUN_DIR']) / 'junit.xml').iter('testcase'))
          required = (
              'a second-device login stays unauthorized until the first device explicitly approves it',
              'a fresh browser can use the 24-word Recovery Key instead of first-device approval',
          )
          for title in required:
              matched = [case for case in cases if case.get('name', '').endswith(title)]
              if len(matched) != 1 or any(matched[0].find(tag) is not None for tag in ('skipped', 'failure', 'error')):
                  raise SystemExit(f'controlled device scenario did not pass exactly once: {title}')
          print('accepted-device pairing and recovery generation invalidation both passed without skips')
          PY
      - name: Run platform live tier
        if: inputs.lane == 'platform-live'
        working-directory: cotest/e2e
        run: npx playwright test --config playwright.config.ts --project=chromium --grep '@platform-live'
      - name: Upload controlled-lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-${{ inputs.lane }}-${{ github.run_id }}
          path: cotest/artifacts/runs/controlled/${{ inputs.lane }}
