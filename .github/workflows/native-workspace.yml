# Shared complete native scope for push CI and the nightly live workflow.
name: Complete native workspace
'on':
  workflow_call:
    inputs:
      source_refs:
        required: true
        type: string
    secrets:
      CI_REPO_TOKEN:
        required: false
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  workspace-tests:
    name: workspace (part ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cotest_test_coauth_evidence
          POSTGRES_USER: cotest
          POSTGRES_PASSWORD: cotest-ci
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U cotest -d cotest_test_coauth_evidence" --health-interval 5s --health-timeout
          5s --health-retries 12
    env:
      DATABASE_URL: postgresql://cotest:cotest-ci@127.0.0.1:5432/cotest_test_coauth_evidence
      COTEST_COLAND_DATABASE_URL: postgresql://cotest:cotest-ci@127.0.0.1:5432/cotest_test_coauth_evidence
      COLAND_TEST_DATABASE_URL: postgresql://cotest:cotest-ci@127.0.0.1:5432/cotest_test_coauth_evidence
      COTEST_COAUTH_DATABASE_URL: postgresql://cotest:cotest-ci@127.0.0.1:5432/cotest_test_coauth_evidence
      COTEST_REQUIRE_LIVE_SERVICES: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
    steps:
    - uses: actions/checkout@v4
      with:
        path: cotest
        ref: ${{ fromJSON(inputs.source_refs).cotest }}
    - uses: ./cotest/.github/actions/checkout-native-sources
      with:
        refs: ${{ inputs.source_refs }}
        token: ${{ secrets.CI_REPO_TOKEN || github.token }}
    - name: Install Linux desktop dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev dbus-x11 gnome-keyring libsecret-tools openssl curl ca-certificates
    - name: Select PostgreSQL 18 backup tools
      shell: bash
      run: |
        set -euo pipefail
        pg_bin=/usr/lib/postgresql/18/bin
        if [ ! -x "$pg_bin/pg_dump" ]; then
          if ! apt-cache show postgresql-client-18 >/dev/null 2>&1; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            . /etc/os-release
            printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
              "$VERSION_CODENAME" "$(dpkg --print-architecture)" \
              | sudo tee /etc/apt/sources.list.d/cotest-pgdg.sources >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
        fi
        "$pg_bin/pg_dump" --version | grep -E '^pg_dump \(PostgreSQL\) 18\.'
        "$pg_bin/pg_restore" --version | grep -E '^pg_restore \(PostgreSQL\) 18\.'
        server_version=$("$pg_bin/psql" "$DATABASE_URL" -Atc 'SHOW server_version_num')
        test "$((server_version / 10000))" -eq 18
        printf 'PostgreSQL server_version_num=%s\n' "$server_version"
        printf '%s\n' "$pg_bin" >> "$GITHUB_PATH"
        printf 'COTEST_PG_DUMP=%s/pg_dump\nCOTEST_PSQL=%s/psql\n' "$pg_bin" "$pg_bin" >> "$GITHUB_ENV"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Media runtime preparation resource regressions
      working-directory: cotest
      run: python -B -m unittest scripts.tests.test_prepare_native_media_runtime
    - name: Prepare verified isolated native media runtime
      working-directory: cotest
      run: python -B scripts/prepare-native-media-runtime.py --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
    - name: Install canonical Spec evaluator dependencies
      run: python -m pip install -r arkret-spec/tools/requirements.txt
    - name: Native runner isolation and public evidence regressions
      working-directory: cotest
      run: python -B -m unittest scripts.tests.test_run_native_rust_tests scripts.tests.test_publish_native_rust_evidence
        scripts.tests.test_run_native_operation_contracts scripts.tests.test_publish_native_operation_status scripts.tests.test_native_workspace_scope
        scripts.tests.test_native_workspace_execution scripts.tests.test_run_native_workspace
    - name: Native preparation tool handoff regressions
      working-directory: cotest
      shell: pwsh
      run: ./scripts/tests/native-tool-environment.tests.ps1
    - name: Install nightly rustfmt
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.98
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: cotest
    - name: Migrate isolated Coauth route-evidence database
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f coauth/crates/storage-postgres/migrations/00000000000000_initial/up.sql
    - name: build (all-features)
      working-directory: cotest
      run: |
        mkdir -p artifacts/sdk-artifact-build
        cargo metadata --all-features --locked --format-version 1 > artifacts/sdk-artifact-build/metadata.json
        cargo build --workspace --all-features --locked --message-format=json > artifacts/sdk-artifact-build/build.jsonl
        python scripts/capture_sdk_artifact.py \
          --cargo-messages artifacts/sdk-artifact-build/build.jsonl \
          --cargo-metadata artifacts/sdk-artifact-build/metadata.json \
          --sdk-manifest ../arkret-rust-sdk/crates/sdk/Cargo.toml \
          --output "$RUNNER_TEMP/cotest-sdk-artifact"
        echo "COTEST_SDK_ARTIFACT_MANIFEST=$RUNNER_TEMP/cotest-sdk-artifact/artifact.json" >> "$GITHUB_ENV"
    - name: Build fresh process-mode test services
      shell: bash
      run: |
        set -euo pipefail
        for svc in coland coauth floria; do
          features=()
          if [ "$svc" = "coland" ]; then
            features=(--features conformance-harness)
          elif [ "$svc" = "coauth" ]; then
            features=(--features cedar)
          fi
          cargo build --manifest-path "$svc/Cargo.toml" --locked --bin "$svc" "${features[@]}"
          target=$(cargo metadata --manifest-path "$svc/Cargo.toml" --locked --format-version 1 --no-deps | jq -er '.target_directory')
          key=$(printf '%s_BIN' "$svc" | tr '[:lower:]' '[:upper:]')
          echo "$key=$target/debug/$svc" >> "$GITHUB_ENV"
        done
    - name: Build real Savfox native binding worker
      shell: bash
      run: |
        set -euo pipefail
        manifest="$(dirname -- "$GITHUB_WORKSPACE")/savfox-ai/savfox/Cargo.toml"
        test -f "$manifest"
        git -C "$(dirname -- "$manifest")" log -1 --format=%H
        output="$GITHUB_WORKSPACE/cotest/artifacts/savfox-binding-worker-build"
        mkdir -p "$output"
        cargo metadata --manifest-path "$manifest" --locked --format-version 1 --no-deps > "$output/metadata.json"
        cargo build --manifest-path "$manifest" --locked -p savfox-channels \
          --no-default-features --features arkret --example arkret_binding_worker \
          --message-format=json-render-diagnostics > "$output/build.jsonl"
        target=$(jq -er '.target_directory' "$output/metadata.json")
        worker=$(jq -ser 'map(select(.reason == "compiler-artifact" and .target.name == "arkret_binding_worker" and ((.target.kind // [] | index("example")) != null) and .executable != null)) | if length == 1 then .[0].executable else error("expected exactly one actual binding worker") end' "$output/build.jsonl")
        case "$worker" in
          "$target/"*) ;;
          *) echo "binding worker is outside Cargo target directory" >&2; exit 1 ;;
        esac
        test -x "$worker"
        printf 'COTEST_SAVFOX_BINDING_WORKER=%s\n' "$worker" >> "$GITHUB_ENV"
    - name: Prepare real isolated Directory service
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($manifest in @('flagon/Cargo.toml', 'arkret-rust-sdk/Cargo.toml')) {
          & cargo metadata --manifest-path $manifest --locked --all-features --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Directory build-input metadata warmup failed' }
        }
        $prepared = @(./cotest/scripts/prepare-cargo-artifact.ps1 `
          -ManifestPath flagon/Cargo.toml -PackageName server -BinaryName server `
          -Jobs 1 -RepositoryRoots @((Join-Path (Get-Location).Path 'arkret-rust-sdk')))
        if ($prepared.Count -ne 1) { throw 'Expected one real Directory service executable' }
        & createdb --maintenance-db $env:DATABASE_URL cotest_test_directory
        if ($LASTEXITCODE -ne 0) { throw 'Independent Directory database creation failed' }
        $database = [System.UriBuilder]::new($env:DATABASE_URL)
        $database.Path = '/cotest_test_directory'
        Add-Content -LiteralPath $env:GITHUB_ENV -Value "FLAGON_BIN=$($prepared[0].ArtifactPath)"
        Add-Content -LiteralPath $env:GITHUB_ENV -Value "FLAGON_DATABASE_URL=$($database.Uri.AbsoluteUri)"
        Add-Content -LiteralPath $env:GITHUB_ENV -Value 'FLAGON_METRICS_BIND=127.0.0.1:0'
    - name: Prepare locked joint browser tooling
      uses: ./cotest/.github/actions/setup-joint-browser
    - name: Prepare Linux joint prerequisites
      id: rust_joint_prerequisites
      run: bash cotest/scripts/prepare-linux-joint-e2e.sh setup
    - name: Prepare current browser conjunction artifacts
      id: rust_browser_artifacts
      working-directory: cotest
      shell: pwsh
      run: ./scripts/run-joint-e2e.ps1 -PreflightOnly -NativeToolsEnvironmentFile $env:GITHUB_ENV -JointDir artifacts/native-browser-preparation
        -ColandBin $env:COLAND_BIN -StartCoauth -StartMockEmail -RunProfile joint-full -PlaywrightProject joint-inkson -Grep
        "@agent-provision-(recovery-prerequisite|durable-recovery)" -RequireScenario "joint/agent-provision-recovery-prerequisite"
        -ForbidSkippedTests
    - name: Compile and account for the complete workspace scope
      working-directory: cotest
      env:
        NATIVE_SOURCE_REFS: ${{ inputs.source_refs }}
      run: |
        set -euo pipefail
        scope="$RUNNER_TEMP/native-workspace-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}"
        mkdir -m 700 "$scope"
        cargo metadata --locked --format-version 1 > "$scope/metadata.json"
        python -B scripts/run-native-workspace.py snapshot \
          --metadata "$scope/metadata.json" --sources-json-env NATIVE_SOURCE_REFS \
          --output "$scope/before-context.json"
        bash ../inkson/scripts/with-native-keystore.sh python scripts/run-native-rust-tests.py \
          --cargo-messages "$scope/build.jsonl" \
          cargo test --workspace --locked --no-fail-fast --no-run --message-format=json
        python -B scripts/run-native-workspace.py plan \
          --metadata "$scope/metadata.json" --messages "$scope/build.jsonl" --shards 4 \
          --sources-json-env NATIVE_SOURCE_REFS --before-context "$scope/before-context.json" \
          --shard-index '${{ matrix.shard }}' --output "$scope/plan.json" \
          --github-env-file "$GITHUB_ENV"
    - name: test
      id: rust_tests
      working-directory: cotest
      run: bash ../inkson/scripts/with-native-keystore.sh python scripts/run-native-rust-tests.py cargo test --workspace --locked
        --no-fail-fast
    - name: Publish complete workspace execution receipts
      if: always()
      working-directory: cotest
      run: python -B scripts/run-native-workspace.py publish --plan "${COTEST_NATIVE_WORKSPACE_PLAN:-}" --output "$RUNNER_TEMP/native-workspace-public/scope-proof.json"
    - name: Preserve complete workspace execution receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-workspace-scope-${{ github.sha }}-${{ github.run_attempt }}-part-${{ matrix.shard }}
        if-no-files-found: error
        path: ${{ runner.temp }}/native-workspace-public/scope-proof.json
    - name: Publish bounded native browser status
      if: always() && matrix.shard == 0
      run: python -B cotest/scripts/publish-native-rust-evidence.py --run-root cotest/artifacts/native-rust/${{ github.run_id
        }}-${{ github.run_attempt }} --output-dir "${{ runner.temp }}/native-rust-public"
    - name: Sanitize native startup diagnostics
      if: always()
      shell: pwsh
      run: |
        ./cotest/scripts/publish-joint-failure.ps1 `
          -RunRoot cotest/artifacts/native-rust/${{ github.run_id }}-${{ github.run_attempt }} `
          -OutputDirectory "$env:RUNNER_TEMP/native-rust-startup-public"
        ./cotest/scripts/publish-joint-failure.ps1 `
          -RunRoot cotest/artifacts/native-browser-preparation `
          -OutputDirectory "$env:RUNNER_TEMP/native-rust-preparation-public"
    - name: Preserve public native diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-rust-public-${{ github.sha }}-${{ github.run_attempt }}-part-${{ matrix.shard }}
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/native-rust-public/summary.json
          ${{ runner.temp }}/native-rust-startup-public/
          ${{ runner.temp }}/native-rust-preparation-public/
    - name: Restore Linux hosts permissions
      if: always() && steps.rust_joint_prerequisites.outcome != 'skipped' && steps.rust_joint_prerequisites.outcome != ''
      run: bash cotest/scripts/prepare-linux-joint-e2e.sh restore
    - name: Record native runner resources
      if: always()
      run: |
        df -h .
        free -h
  workspace-coverage:
    name: complete workspace execution coverage
    needs:
    - workspace-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: cotest
        ref: ${{ fromJSON(inputs.source_refs).cotest }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        pattern: native-workspace-scope-${{ github.sha }}-${{ github.run_attempt }}-part-*
        path: ${{ runner.temp }}/native-workspace-proofs
    - name: Require every native target and all real doctest invocations
      env:
        NATIVE_SOURCE_REFS: ${{ inputs.source_refs }}
      run: python -B cotest/scripts/run-native-workspace.py aggregate --root "${{ runner.temp }}/native-workspace-proofs"
        --expected-sources-json-env NATIVE_SOURCE_REFS
