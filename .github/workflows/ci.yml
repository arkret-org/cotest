name: CI

# cotest local CI (P2F.5). Runs fmt / clippy / test / typos / deny / audit
# plus the e2e Playwright matrix. Does NOT publish; cotest is `publish=false`
# and the circle-rollout milestone explicitly bans tag / release work.

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  SIBLING_REF: circle-rollout

jobs:
  rust:
    name: rust (${{ matrix.toolchain }} / clippy / test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The crate uses edition 2024 and the current SDK requires the
        # release pipeline toolchain.
        toolchain: ["1.97"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      # arkret-rust-sdk is a path dependency; check it out as a sibling so
      # `cargo check` resolves crates/* under ../arkret-rust-sdk.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cotest
      - name: fmt
        working-directory: cotest
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: cotest
        # cotest carries TODO scaffolding for the circle-rollout milestone;
        # treat warnings as errors so drift surfaces before merge.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build (all-features)
        working-directory: cotest
        run: cargo build --workspace --all-features --locked
      - name: build (no-default-features)
        working-directory: cotest
        run: cargo build --workspace --no-default-features --locked
      - name: test
        working-directory: cotest
        # Skip live-server scenarios — they are gated by `#[ignore]` and
        # bootstrapped by the integration.yml workflow.
        run: cargo test --workspace --locked
      - name: check_ignore_comments hygiene
        working-directory: cotest
        # Every `#[ignore]` attribute must carry a `/// Issue:` or
        # `/// Gating:` justification and a valid `/// Tier:` declaration.
        run: bash scripts/check_ignore_comments.sh

  typecheck:
    name: typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    # Static type gate for the e2e TypeScript suite. Playwright runs specs
    # through esbuild (transpile-only, no type check); `tsc --noEmit` is the
    # gate that catches wire-body field typos, signature drift, and null misuse
    # before they reach an (expensive, docker-bound) live run. Self-contained:
    # only the e2e npm deps are required.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci || npm install
      - name: typecheck
        working-directory: e2e
        run: npm run typecheck
      - name: spec wire-type drift
        working-directory: e2e
        # Regenerates the committed mirrors of the closed arkret-spec object
        # schemas and fails when they are stale. Reports SKIP when the sibling
        # arkret-spec checkout is absent (this job checks out cotest only), so
        # the hard gate lives in `scripts/run-hygiene.ps1` and the joint runner.
        run: npm run check:wire-types

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master
        with:
          config: .typos.toml

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: cotest/Cargo.toml
          command: check
          arguments: --config deny.toml

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cotest
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        working-directory: cotest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ignores < <(grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4}' deny.toml | sort -u)
          args=()
          for advisory in "${ignores[@]}"; do
            args+=(--ignore "$advisory")
          done
          cargo audit --deny warnings "${args[@]}"

  fuzz:
    name: fuzz (envelope / snapshot / seal, 60s each)
    runs-on: ubuntu-latest
    # P5.1 — wire-envelope fuzz harnesses get a per-target 60s libFuzzer
    # budget. Total wall-clock is capped at 5 min so PR latency stays bounded;
    # nightly extended runs live in integration.yml under a longer schedule.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}
      - uses: dtolnay/rust-toolchain@master
        with:
          # cargo-fuzz needs nightly for the libFuzzer integration.
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cotest
            cotest/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: envelope_fuzz (60s)
        working-directory: cotest
        run: cargo fuzz run envelope_fuzz -- -max_total_time=60
      - name: snapshot_fuzz (60s)
        working-directory: cotest
        run: cargo fuzz run snapshot_fuzz -- -max_total_time=60
      - name: seal_fuzz (60s)
        working-directory: cotest
        run: cargo fuzz run seal_fuzz -- -max_total_time=60

  e2e:
    name: e2e (playwright / ${{ matrix.project }})
    runs-on: ubuntu-latest
    # PR gate: run a real Playwright probe against a live soland instead of
    # list-only discovery. Broader cross-service Playwright runs stay in
    # integration.yml where the nightly budget can absorb them.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: inkson
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/soland
          path: soland
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cotest
            soland
      - name: Build soland Docker image
        working-directory: cotest
        shell: pwsh
        run: ./scripts/build-soland-image.ps1 -ImageTag cotest-soland:pr-${{ github.run_id }}
      - name: Install playwright
        working-directory: cotest/e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps ${{ matrix.project }}
      - name: Run Docker-image Playwright smoke
        working-directory: cotest
        shell: pwsh
        run: >
          ./scripts/run-joint-e2e.ps1
          -SolandRuntime docker
          -SolandImage cotest-soland:pr-${{ github.run_id }}
          -SkipInkson
          -SkipNpmInstall
          -SkipBrowserInstall
          -RunProfile joint-smoke
          -PlaywrightProject ${{ matrix.project }}
          -Grep "soland /_arkret/describe"

      # PR is the contract/deterministic lane. Tests tagged @mls-data-plane or
      # @platform-live are reserved for controlled.yml and must not be added to
      # this job's smoke selection.
