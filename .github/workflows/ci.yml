name: CI

# cotest local CI. Runs fmt / clippy / test / typos / deny / audit plus the
# e2e Playwright matrix. Does NOT publish: cotest is `publish = false` and no
# job may create a tag or release.

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  SIBLING_REF: main

jobs:
  rust:
    name: rust (${{ matrix.toolchain }} / clippy / test)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cotest_coauth_evidence
          POSTGRES_USER: cotest
          POSTGRES_PASSWORD: cotest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cotest -d cotest_coauth_evidence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://cotest:cotest-ci@127.0.0.1:5432/cotest_coauth_evidence
      # The workspace links many complete process-test executables. Keep
      # assertions enabled while avoiding parallel linker and debug-data pressure.
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        # The crate uses edition 2024 and the current SDK requires the
        # release pipeline toolchain.
        toolchain: ["1.98"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      # arkret-rust-sdk is a path dependency; check it out as a sibling so
      # `cargo check` resolves crates/* under ../arkret-rust-sdk.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: inkson
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/soland
          path: soland
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev dbus-x11 gnome-keyring libsecret-tools openssl

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cotest
      - name: Migrate isolated Coauth route-evidence database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f coauth/crates/storage-postgres/migrations/00000000000000_initial/up.sql
      - name: fmt
        working-directory: cotest
        run: cargo +nightly fmt --all -- --check
      - name: clippy
        working-directory: cotest
        # cotest carries TODO scaffolding for in-flight coverage; treat
        # warnings as errors so drift surfaces before merge.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build (all-features)
        working-directory: cotest
        run: cargo build --workspace --all-features --locked
      - name: build (no-default-features)
        working-directory: cotest
        run: cargo build --workspace --no-default-features --locked
      - name: Build fresh process-mode test services
        shell: bash
        run: |
          set -euo pipefail
          for svc in soland coauth floria; do
            features=""
            if [ "$svc" = "soland" ]; then
              features="--features conformance-harness"
            elif [ "$svc" = "coauth" ]; then
              features="--features cedar"
            fi
            cargo build --manifest-path "$svc/Cargo.toml" --locked --bin "$svc" $features
            target=$(cargo metadata --manifest-path "$svc/Cargo.toml" --locked --format-version 1 --no-deps | jq -er '.target_directory')
            key=$(printf '%s_BIN' "$svc" | tr '[:lower:]' '[:upper:]')
            echo "$key=$target/debug/$svc" >> "$GITHUB_ENV"
          done
      - name: test
        working-directory: cotest
        # Mandatory process scenarios use the freshly built sibling services.
        # Explicit opt-in ignored probes remain in integration.yml.
        run: bash ../inkson/scripts/with-native-keystore.sh python scripts/run-native-rust-tests.py cargo test --workspace --locked
      - name: check_ignore_comments hygiene
        working-directory: cotest
        # Every `#[ignore]` attribute must carry a `/// Issue:` or
        # `/// Gating:` justification and a valid `/// Tier:` declaration.
        run: bash scripts/check_ignore_comments.sh
      - name: Record native runner resources
        if: always()
        run: |
          df -h .
          free -h

  operation-coverage:
    name: operation test coverage inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/soland
          path: soland
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: inkson
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: generator unit tests
        working-directory: cotest
        run: >-
          python -m unittest
          scripts.tests.test_operation_test_coverage
          scripts.tests.test_api_only_migration
          scripts.tests.test_package_graph
      - name: reject stale or manually edited inventory
        working-directory: cotest
        run: python scripts/check_operation_test_coverage.py --check

  typecheck:
    name: typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    # Static type gate for the e2e TypeScript suite. Playwright runs specs
    # through esbuild (transpile-only, no type check); `tsc --noEmit` is the
    # gate that catches wire-body field typos, signature drift, and null misuse
    # before they reach an (expensive, docker-bound) live run. Self-contained:
    # only the e2e npm deps are required.
    defaults:
      run:
        working-directory: cotest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install e2e deps
        working-directory: cotest/e2e
        run: npm ci
      - name: typecheck
        working-directory: cotest/e2e
        run: npm run typecheck
      - name: provisioning cache isolation
        working-directory: cotest/e2e
        # The memo behind `ensureRegistered` is load-bearing: the Coauth handle
        # it registers is a fresh uuid, so nothing server-side deduplicates a
        # second founding. Its isolation rules are kept Playwright-free so they
        # can be checked here rather than only in a joint run.
        run: npm run check:provisioning-cache
      - name: browserless lane resources
        shell: pwsh
        # `joint-api` must collect no browser setup project, the runner's
        # project classification must match playwright.config.ts, and no lane's
        # selection may shrink below its recorded floor. Needs only the e2e npm
        # deps installed above.
        run: ./scripts/tests/browserless-lane-resources.tests.ps1
      - name: identity CI selection gate
        shell: pwsh
        # Proves the workflow selectors resolve to the two real joint-inkson
        # cases. The live lanes additionally require JUnit evidence and reject
        # runtime skips, so static discovery cannot become a false green.
        run: ./scripts/tests/identity-ci-selection.tests.ps1
      - name: spec wire-type drift
        working-directory: cotest/e2e
        # Regenerates the committed mirrors of the closed arkret-spec object
        # schemas and fails when they are stale. The normative spec is checked
        # out as a sibling so this job executes the complete drift check.
        run: npm run check:wire-types
      - name: fixme quality gate
        working-directory: cotest/e2e
        # Enforces docs/fixme-promotion-checklist.md: no empty `test.fixme`
        # bodies, and every fixme carries @blocking-on / @user-promise /
        # @expected-live-by. It previously existed only as an npm alias with no
        # automated caller.
        run: npm run check:fixme

  package-graph:
    name: server/client/light package boundaries
    runs-on: ubuntu-latest
    # `cotest-provision` / `cotest-wire` exist so the browserless lane builds
    # without Inkson's wasm and the Soland implementation crates. That property
    # is now checked for root/client as well as the light edge. `cargo metadata` resolves the graph without
    # compiling anything, so this job needs every path-dependency sibling
    # checked out but no build cache.
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: inkson
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/soland
          path: soland
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: package graph gate
        working-directory: cotest
        run: python scripts/check_package_graph.py

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master
        with:
          config: .typos.toml

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: inkson
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/soland
          path: soland
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: cotest/Cargo.toml
          command: check
          arguments: --all-features --locked --config cotest/deny.toml

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: inkson
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/soland
          path: soland
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cotest
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test dependency selection policy
        working-directory: cotest
        run: python -m unittest scripts.tests.test_audit_compiled_dependencies
      - name: Run cargo audit
        working-directory: cotest
        run: python scripts/audit_compiled_dependencies.py

  fuzz:
    name: fuzz (envelope / realm snapshot, 60s each)
    runs-on: ubuntu-latest
    # P5.1 — wire-envelope fuzz harnesses get a per-target 60s libFuzzer
    # budget. The SDK-only sanitizer build and cargo-fuzz installation have
    # separate startup costs that do not consume the per-target fuzz budget.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: inkson
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/soland
          path: soland
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@master
        with:
          # cargo-fuzz needs nightly for the libFuzzer integration.
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cotest
            cotest/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: envelope_fuzz (60s)
        working-directory: cotest
        run: cargo fuzz run envelope_fuzz -- -max_total_time=60
      - name: realm_state_snapshot_fuzz (60s)
        working-directory: cotest
        run: cargo fuzz run realm_state_snapshot_fuzz -- -max_total_time=60

  e2e:
    name: e2e (playwright / ${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # PR gate: run a real Playwright probe against a live soland instead of
    # list-only discovery. Broader cross-service Playwright runs stay in
    # integration.yml where the nightly budget can absorb them.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: inkson
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/soland
          path: soland
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cotest
            soland
            coauth
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build soland Docker image
        working-directory: cotest
        shell: pwsh
        run: ./scripts/build-soland-image.ps1 -ImageTag cotest-soland:pr-${{ github.run_id }}
      - name: Install playwright
        working-directory: cotest/e2e
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.project }}
      - name: Prepare Linux joint prerequisites
        id: joint_prerequisites
        run: bash cotest/scripts/prepare-linux-joint-e2e.sh setup

      - name: Run real OIDC returning-login merge gate
        working-directory: cotest
        shell: pwsh
        run: >
          ./scripts/run-joint-e2e.ps1
          -SolandRuntime docker
          -SolandImage cotest-soland:pr-${{ github.run_id }}
          -StartCoauth
          -RunProfile joint-smoke
          -PlaywrightProject joint-inkson
          -Grep "@returning-login-gate|@onboarding-recovery-gate"
          -RequireScenario "identity/oidc-login-flow.spec.ts"
          -ForbidSkippedTests

      - name: Restore Linux hosts permissions
        if: always() && steps.joint_prerequisites.outcome != 'skipped' && steps.joint_prerequisites.outcome != ''
        run: bash cotest/scripts/prepare-linux-joint-e2e.sh restore

