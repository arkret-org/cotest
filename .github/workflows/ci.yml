  e2e:
    name: e2e (playwright / ${{ matrix.project }})
    needs: [typecheck, native-sources]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # PR gate: run a real Playwright probe against a live coland instead of
    # list-only discovery. Broader cross-service Playwright runs stay in
    # integration.yml where the nightly budget can absorb them.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest

      - uses: ./cotest/.github/actions/checkout-native-sources
        with:
          refs: ${{ needs.native-sources.outputs.refs }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cotest
            coland
            coauth
      - name: Prepare locked joint browser tooling
        uses: ./cotest/.github/actions/setup-joint-browser
        with:
          project: ${{ matrix.project }}
      - name: Reclaim Docker build space
        run: |
          docker system prune --all --force
          docker builder prune --all --force
      - name: Build coland Docker image
        working-directory: cotest
        shell: pwsh
        run: ./scripts/build-coland-image.ps1 -ImageTag cotest-coland:pr-${{ github.run_id }}
      - name: Docker fixture ownership and public diagnostic regressions
        working-directory: cotest
        shell: pwsh
        run: |
          ./scripts/tests/joint-docker-filesystem.tests.ps1
          ./scripts/tests/joint-docker-postgres.tests.ps1
          ./scripts/tests/joint-managed-tls-proxy.tests.ps1
          ./scripts/tests/publish-joint-failure.tests.ps1
      - name: Prepare Linux joint prerequisites
        id: joint_prerequisites
        run: bash cotest/scripts/prepare-linux-joint-e2e.sh setup

      - name: Run real OIDC, recovery and collaboration regression merge gate
        working-directory: cotest
        shell: pwsh
        run: >
          ./scripts/run-joint-e2e.ps1
          -ColandRuntime docker
          -ColandImage cotest-coland:pr-${{ github.run_id }}
          -StartCoauth
          -RunProfile joint-smoke
          -PlaywrightProject joint-inkson
          -Grep "@returning-login-gate|@onboarding-recovery-gate|share-link members keep synchronizing messages and leave after reload; MLS=|account owner uploads, cold-loads and clears the canonical profile avatar through Settings|registration explains its supported required contact methods|public HTTPS deployment delivers the same-origin WSS challenge|cold requester signs a real locator Contact request; recipient=|Contact address instructions advertise only supported inputs|@coauth-handle-boundary"
          -RequireScenario "identity/oidc-login-flow.spec.ts,joint/realm-invite-link-sync.spec.ts,discovery/contact-request-ui.spec.ts,identity/account-profile-ui.spec.ts,identity/registration-contact-validation.spec.ts,sync/websocket-deployment.spec.ts,identity/coauth-handle-length-ui.spec.ts"
          -ForbidSkippedTests

      - name: Run real multi-user collaboration regressions
        working-directory: cotest
        shell: pwsh
        run: >
          ./scripts/run-joint-e2e.ps1
          -ColandRuntime docker
          -ColandImage cotest-coland:pr-${{ github.run_id }}
          -StartCoauth
          -RunProfile joint-smoke
          -PlaywrightProject joint-collaboration
          -Grep "@community-collaboration-gate|@community-event-gate"
          -RequireScenario "messaging/triad-collaboration.spec.ts,kanban/cross-member-encrypted.spec.ts,joint/encrypted-attachment-two-device.spec.ts,workflows/community-event.spec.ts"
          -ForbidSkippedTests

      - name: Restore Linux hosts permissions
        if: always() && steps.joint_prerequisites.outcome != 'skipped' && steps.joint_prerequisites.outcome != ''
        run: bash cotest/scripts/prepare-linux-joint-e2e.sh restore

      - name: Sanitize managed startup failure diagnostics
        if: failure()
        shell: pwsh
        run: >-
          ./cotest/scripts/publish-joint-failure.ps1
          -RunRoot cotest/artifacts/runs/joint-e2e
          -OutputDirectory "${{ runner.temp }}/joint-public-failure"

      - name: Preserve joint failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: joint-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.project }}
          path: |
            cotest/artifacts/runs/joint-e2e/**/services/prepare-*.log
            cotest/e2e/test-results/
            ${{ runner.temp }}/joint-public-failure/
          if-no-files-found: ignore
          retention-days: 7

      # PR is the contract/deterministic lane. Tests tagged @mls-data-plane or
      # @platform-live are reserved for controlled.yml and must not be added to
      # this job's smoke selection.
