          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coland
          path: coland
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Complete Coland build dependency layout
        working-directory: coland
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-build-dependencies.sh

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cotest
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test dependency selection policy
        working-directory: cotest
        run: python -m unittest scripts.tests.test_audit_compiled_dependencies
      - name: Run cargo audit
        working-directory: cotest
        run: python scripts/audit_compiled_dependencies.py

  fuzz:
    name: fuzz (envelope / realm snapshot, 60s each)
    runs-on: ubuntu-latest
    # P5.1 — wire-envelope fuzz harnesses get a per-target 60s libFuzzer
    # budget. The SDK-only sanitizer build and cargo-fuzz installation have
    # separate startup costs that do not consume the per-target fuzz budget.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: inkson
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coland
          path: coland
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Complete Coland build dependency layout
        working-directory: coland
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-build-dependencies.sh

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@master
        with:
          # cargo-fuzz needs nightly for the libFuzzer integration.
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cotest
            cotest/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: envelope_fuzz (60s)
        working-directory: cotest
        run: cargo fuzz run envelope_fuzz -- -max_total_time=60
      - name: realm_state_snapshot_fuzz (60s)
        working-directory: cotest
        run: cargo fuzz run realm_state_snapshot_fuzz -- -max_total_time=60

  e2e:
    name: e2e (playwright / ${{ matrix.project }})
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # PR gate: run a real Playwright probe against a live coland instead of
    # list-only discovery. Broader cross-service Playwright runs stay in
    # integration.yml where the nightly budget can absorb them.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          path: cotest

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: inkson
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coland
          path: coland
          ref: ${{ env.SIBLING_REF }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Complete Coland build dependency layout
        working-directory: coland
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-build-dependencies.sh

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cotest
            coland
            coauth
      - name: Prepare locked joint browser tooling
        uses: ./cotest/.github/actions/setup-joint-browser
        with:
          project: ${{ matrix.project }}
      - name: Build coland Docker image
        working-directory: cotest
        shell: pwsh
        run: ./scripts/build-coland-image.ps1 -ImageTag cotest-coland:pr-${{ github.run_id }}
      - name: Docker fixture ownership and public diagnostic regressions
        working-directory: cotest
        shell: pwsh
        run: |
          ./scripts/tests/joint-docker-filesystem.tests.ps1
          ./scripts/tests/joint-docker-postgres.tests.ps1
          ./scripts/tests/publish-joint-failure.tests.ps1
      - name: Prepare Linux joint prerequisites
        id: joint_prerequisites
        run: bash cotest/scripts/prepare-linux-joint-e2e.sh setup

      - name: Run real OIDC returning-login merge gate
        working-directory: cotest
        shell: pwsh
        run: >
          ./scripts/run-joint-e2e.ps1
          -ColandRuntime docker
          -ColandImage cotest-coland:pr-${{ github.run_id }}
          -StartCoauth
          -RunProfile joint-smoke
          -PlaywrightProject joint-inkson
          -Grep "@returning-login-gate|@onboarding-recovery-gate"
          -RequireScenario "identity/oidc-login-flow.spec.ts"
          -ForbidSkippedTests

      - name: Restore Linux hosts permissions
        if: always() && steps.joint_prerequisites.outcome != 'skipped' && steps.joint_prerequisites.outcome != ''
        run: bash cotest/scripts/prepare-linux-joint-e2e.sh restore

      - name: Sanitize managed startup failure diagnostics
        if: failure()
        shell: pwsh
        run: >-
          ./cotest/scripts/publish-joint-failure.ps1
          -RunRoot cotest/artifacts/runs/joint-e2e
          -OutputDirectory "${{ runner.temp }}/joint-public-failure"

      - name: Preserve joint failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: joint-failure-${{ github.run_id }}-${{ matrix.project }}
          path: |
            cotest/artifacts/runs/joint-e2e/**/services/prepare-*.log
            cotest/e2e/test-results/
            ${{ runner.temp }}/joint-public-failure/
          if-no-files-found: ignore
          retention-days: 7

      # PR is the contract/deterministic lane. Tests tagged @mls-data-plane or
      # @platform-live are reserved for controlled.yml and must not be added to
      # this job's smoke selection.
