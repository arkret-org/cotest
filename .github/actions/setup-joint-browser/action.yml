name: Prepare locked joint browser tooling
description: Install the existing joint browser build tools against the checked-out Inkson lock.
inputs:
  project:
    description: Playwright browser project.
    default: chromium
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
    - name: Install native toolchain web target
      shell: bash
      run: rustup target add wasm32-unknown-unknown
    - name: Install Dioxus CLI
      shell: bash
      run: |
        set -euo pipefail
        test "$RUNNER_OS/$RUNNER_ARCH" = Linux/X64
        tools=$(mktemp -d "$RUNNER_TEMP/dioxus-cli-0.7.10-XXXXXX")
        archive="$tools/dx.tar.gz"
        # Bind the published bytes as well as the version; the upstream tag
        # and release assets are mutable. This is the existing CLI version.
        curl -q --fail --silent --show-error --location --retry 3 \
          --proto '=https' --proto-redir '=https' \
          https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz \
          --output "$archive"
        printf '%s  %s\n' 4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7 "$archive" \
          | sha256sum --check --strict
        python - "$archive" "$tools/dx" <<'PY'
        from pathlib import Path, PurePosixPath
        import os
        import shutil
        import sys
        import tarfile
        with tarfile.open(sys.argv[1], 'r:gz') as archive:
            matches = [item for item in archive.getmembers()
                       if PurePosixPath(item.name).parts == ('dx',)]
            if len(matches) != 1:
                raise SystemExit('expected one published dx binary')
            member = matches[0]
            if (not member.isfile() or member.mode & 0o7000 or not member.mode & 0o111
                    or not 0 < member.size <= 512 * 1024 * 1024):
                raise SystemExit('invalid published dx binary')
            binary = Path(sys.argv[2])
            with archive.extractfile(member) as source, binary.open('xb') as target:
                shutil.copyfileobj(source, target)
            os.chmod(binary, member.mode & 0o777)
        PY
        "$tools/dx" --version | tee "$tools/version.txt"
        python - "$tools/version.txt" <<'PY'
        from pathlib import Path
        import re
        import sys
        version = Path(sys.argv[1]).read_text(encoding='utf-8').strip()
        if not re.fullmatch(r'dioxus 0\.7\.10(?: \([^\r\n]*\))?', version):
            raise SystemExit('published dx has an unexpected version')
        PY
        printf '%s\n' "$tools" >> "$GITHUB_PATH"
    - name: Install locked Inkson wasm-bindgen CLI
      shell: bash
      run: |
        set -euo pipefail
        version="$(python - <<'PY'
        import re
        import tomllib
        from pathlib import Path
        packages = tomllib.loads(Path("inkson/Cargo.lock").read_text())["package"]
        versions = {p["version"] for p in packages if p["name"] == "wasm-bindgen"}
        if len(versions) != 1:
            raise SystemExit("Expected exactly one locked Inkson wasm-bindgen version")
        version = versions.pop()
        if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
            raise SystemExit("Expected a stable wasm-bindgen version")
        print(version)
        PY
        )"
        tools="${DX_HOME:-$HOME/.dx}/tools/wasm-bindgen-$version"
        cargo install wasm-bindgen-cli --version "$version" --locked --bin wasm-bindgen --root "$tools"
        install -m 755 "$tools/bin/wasm-bindgen" "$tools/wasm-bindgen"
        test "$("$tools/wasm-bindgen" --version)" = "wasm-bindgen $version"
    - name: Install frontend task runner
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: "1.46.0"
    - name: Install locked Playwright browser
      shell: bash
      working-directory: cotest/e2e
      env:
        BROWSER_PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail
        case "$BROWSER_PROJECT" in
          chromium|firefox|webkit) ;;
          *) echo "unsupported Playwright browser project" >&2; exit 1 ;;
        esac
        npm ci
        ./node_modules/.bin/playwright install --with-deps "$BROWSER_PROJECT"
    - name: Expose the locked Dioxus JavaScript bundler
      shell: bash
      working-directory: cotest/e2e
      run: |
        set -euo pipefail
        test "$(node_modules/.bin/esbuild --version)" = "0.28.2"
        printf '%s\n' "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
